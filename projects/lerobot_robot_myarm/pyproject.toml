[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_myarm"
version = "0.1.0"
description = "MuJoCo UR5 robot and keyboard teleoperator adapter for LeRobot"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pynput",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lerobot_robot_myarm*"]